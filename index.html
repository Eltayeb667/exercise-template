<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Learning Slides</title>
<style>
:root {
  --bg-dark: #0f172a;
  --panel-dark: #1e293b;
  --button-bg: #334155;
  --button-hover: #475569;
  --text-color: #ffffff;
  --focus-outline: 2px solid #38bdf8;
  font-size: 100%;
}
body {
  margin: 0;
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg-dark);
  color: var(--text-color);
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.slide {
  flex: 1;
  display: none;
  padding: 2rem;
  text-align: center;
  justify-content: center;
  align-items: center;
}
.slide.active {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
h1 { font-size: 2rem; margin-bottom: 0.5em; line-height: 1.3; }
p, li { font-size: 1.2rem; line-height: 1.7; margin: 0.4em 0; }
audio {
  margin: 1rem 0;
  width: 90%;
  max-width: 650px;
}
details {
  background: var(--panel-dark);
  border-radius: 6px;
  margin: 0.6rem 0;
  padding: 0.8rem 1rem;
  width: 90%;
  max-width: 650px;
  text-align: left;
}
summary {
  cursor: pointer;
  font-size: 1rem;
  font-weight: 600;
  color: #f8fafc;
}
.controls {
  background: var(--panel-dark);
  padding: 0.8rem 1.2rem;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
}
button {
  padding: 0.6rem 1rem;
  font-size: 1rem;
  border: none;
  border-radius: 4px;
  background: var(--button-bg);
  color: var(--text-color);
  cursor: pointer;
  transition: background 0.3s;
}
button:hover, button:focus { background: var(--button-hover); }
button:focus-visible { outline: var(--focus-outline); }
input[type="number"], input[type="text"] {
  width: 100px;
  text-align: center;
  padding: 0.4rem;
  border-radius: 4px;
  border: none;
}
.range-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: #f8fafc;
  font-size: 1rem;
}
:focus-visible { outline: var(--focus-outline); outline-offset: 2px; }
@media (min-width: 1025px) { h1 { font-size: 2.2rem; } }
@media (max-width: 1024px) {
  h1 { font-size: 2rem; }
  .controls { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 768px) {
  h1 { font-size: 1.7rem; }
  audio { width: 100%; }
  .controls { flex-direction: column; align-items: stretch; gap: 0.7rem; }
  button, input { width: 100%; }
}
@media (max-width: 480px) {
  h1 { font-size: 1.5rem; }
  p, li { font-size: 1rem; }
}
</style>
</head>
<body>

<main id="slide" class="slide active" tabindex="0" role="main" aria-live="polite"></main>

<nav class="controls" aria-label="Slide Controls">
  <div role="group" aria-label="Navigation Buttons">
    <button onclick="prev()" aria-label="Previous Slide">⬅ Previous</button>
    <button onclick="next()" aria-label="Next Slide">Next ➡</button>
    <button onclick="speak()" aria-label="Read Aloud">🔊 Speak</button>
    <button onclick="toggleAuto()" aria-label="Auto Slides">▶ Auto</button>
    <label style="margin-left:10px;">
      <input type="checkbox" id="autoPlayAudio" aria-label="Auto Play Audio"> Auto Play Audio
    </label>
  </div>

  <div aria-label="Slide Info">
    Slide <span id="current">1</span> / <span id="total"></span>
  </div>

  <div>
    <label for="goBox">Go to Slide(s):</label>
    <input type="text" id="goBox" placeholder="e.g., 3 or 3,5,12">
    <button onclick="go()">OK</button>
  </div>

  <div class="range-group" aria-label="Voice Rate">
    <label for="rateSlider">Rate:</label>
    <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1" aria-valuetext="Speech rate">
    <span id="rateValue">1.0x</span>
  </div>
</nav>

<script>
let allData = null;
let data = [];
let index = 0;
let autoSlide = false;
let timer = null;
let autoAudio = false;

const box = document.getElementById("slide");
const rateSlider = document.getElementById("rateSlider");
const rateValue = document.getElementById("rateValue");
const autoPlayAudioCheckbox = document.getElementById("autoPlayAudio");
autoPlayAudioCheckbox.addEventListener("change", () => { autoAudio = autoPlayAudioCheckbox.checked; });

fetch("slides.json")
  .then(res => res.json())
  .then(json => {
    allData = json.slides;
    data = allData.slice();
    document.getElementById("total").textContent = data.length;
    render();
  });

function render() {
  if (!data || data.length === 0) return;
  const s = data[index];
  let html = "";

  const commonAudio = `<audio id="audioPlayer" controls src="${s.audio}" aria-label="Audio for this slide"></audio>
    <details><summary>English Script</summary><p>${s.script_en}</p></details>
    <details><summary>Arabic Translation</summary><p dir="rtl">${s.script_ar}</p></details>`;

  if (s.type === "listening") {
    html = `<h1>${s.title}</h1>${commonAudio}
      <p><strong>Question:</strong> ${s.question}</p>
      <details><summary>Answer</summary><p>${s.answer}</p></details>`;
  } 
  else if (s.type === "useWord") {
    html = `<h1>${s.title}</h1>${commonAudio}
      <p><strong>Word:</strong> ${s.word}</p>
      <p><strong>Example:</strong> ${s.example}</p>
      <p><strong>Question:</strong> ${s.question}</p>
      <details><summary>Answer</summary><p>${s.answer}</p></details>`;
  }
  else if (s.type === "vocabDef") {
    html = `<h1>${s.title}</h1>${commonAudio}
      <p><strong>Word:</strong> ${s.vocab_item}</p>
      <details><summary>Show Definition</summary><p>${s.definition}</p></details>
      <p><strong>Question:</strong> ${s.question}</p>
      <details><summary>Answer</summary><p>${s.answer}</p></details>`;
  }
  else if (s.type === "vocabPic") {
    html = `<h1>${s.title}</h1>${commonAudio}
      <p><strong>Word:</strong> ${s.vocab_item}</p>
      <details><summary>Show Image</summary>
        <img src="${s.image}" alt="Image of ${s.vocab_item}" style="max-width:400px;width:90%;border-radius:6px;margin:10px 0;">
      </details>
      <p><strong>Question:</strong> ${s.question}</p>
      <details><summary>Answer</summary><p>${s.answer}</p></details>`;
  }
  else if (["quiz2","quiz3","quiz4"].includes(s.type)) {
    html = `<h1>${s.title}</h1>${commonAudio}
      <p><strong>Question:</strong> ${s.question}</p>
      <ul style="list-style:none;padding:0;margin-top:10px;">
        ${s.options.map((opt,i)=>`<li>(${String.fromCharCode(65+i)}) ${opt}</li>`).join("")}
      </ul>
      <details><summary>Correct Answer</summary><p>${s.answer}</p></details>`;
  }
  else if (s.type === "translate") {
    html = `<h1>${s.title}</h1>${commonAudio}
      <p><strong>Instruction:</strong> Look at the Arabic text and translate it into English.</p>
      <details><summary>Show Arabic</summary><p dir="rtl">${s.script_ar}</p></details>
      <details><summary>Show English Translation</summary><p>${s.script_en}</p></details>`;
  }
  else if (s.type === "trueFalse") {
    html = `<h1>${s.title}</h1>${commonAudio}
      <p><strong>Question:</strong> ${s.question}</p>
      <ul style="list-style:none;padding:0;margin-top:10px;">
        ${s.options.map((opt,i)=>`<li>${opt}</li>`).join("")}
      </ul>
      <details><summary>Answer</summary><p>${s.answer}</p></details>`;
  }

  box.innerHTML = html;
  document.getElementById("current").textContent = index + 1;

  if (autoAudio) {
    const player = document.getElementById("audioPlayer");
    player.play().catch(()=>{});
  }

  if (autoSlide) {
    clearTimeout(timer);
    timer = setTimeout(next, 9000);
  }
  box.focus();
}

function next() { if (index < data.length - 1) { index++; render(); } }
function prev() { if (index > 0) { index--; render(); } }

function go() {
  const value = document.getElementById("goBox").value.trim();
  if (!value) return;
  const parts = value.split(",").map(x => parseInt(x.trim())).filter(x => !isNaN(x) && x > 0);
  if (parts.length === 1) {
    data = allData.slice();
    index = parts[0] - 1;
    document.getElementById("total").textContent = data.length;
  } else if (parts.length > 1) {
    const uniqueSorted = [...new Set(parts)]
      .filter(n => n <= allData.length)
      .sort((a,b)=>a-b);
    data = uniqueSorted.map(i => allData[i - 1]);
    index = 0;
    document.getElementById("total").textContent = data.length;
  }
  render();
}

function speak() {
  if (!data) return;
  const s = data[index];
  let text = s.title + ". " + (s.script_en || s.question || "");
  text = text.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
  window.speechSynthesis.cancel();
  const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
  const speakNext = arr => {
    if (!arr.length) return;
    const msg = new SpeechSynthesisUtterance(arr.shift().trim());
    msg.rate = parseFloat(rateSlider.value);
    msg.lang = "en-US";
    msg.onend = () => speakNext(arr);
    window.speechSynthesis.speak(msg);
  };
  speakNext(parts);
}

rateSlider.addEventListener("input",()=>rateValue.textContent=rateSlider.value+"x");
function toggleAuto(){ autoSlide = !autoSlide; render(); }

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
});
let startX=0;
document.addEventListener("touchstart", e=> startX=e.touches[0].clientX);
document.addEventListener("touchend", e=>{
  const endX=e.changedTouches[0].clientX;
  if(startX-endX>50) next();
  if(endX-startX>50) prev();
});
</script>
</body>
</html>
